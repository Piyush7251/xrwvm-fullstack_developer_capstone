name: Lint Code Base

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python with flake8
        run: |
          flake8 server/djangoapp server/djangoproj --max-line-length=120 --exclude=migrations,__pycache__

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Lint JavaScript with JSHint
        run: |
          echo '{"esversion": 11, "node": true, "sub": true}' > /tmp/.jshintrc
          jshint --config /tmp/.jshintrc server/database/app.js
